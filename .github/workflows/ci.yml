name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Build, test, and publish extension artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare WXT types
        run: npx wxt prepare

      - name: Typecheck
        run: npm run typecheck

      - name: Run smoke tests
        run: npm test -- tests/conversion.test.ts tests/export-workflow.test.ts tests/validation.test.ts

      - name: Build extension
        run: npm run build

      - name: Publish unpacked Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome-mv3-${{ github.sha }}
          path: .output/chrome-mv3/**
          if-no-files-found: error
          retention-days: 14
